openapi: 3.0.3
info:
  title: FairSeat API
  version: 0.0.1
  description: |
    Contract between the FairSeat interface and service (Team 4 side project).
    v0.0.1 holds only sign-in and health, so the pipeline and deployment can be proven.
    The MVP paths (events, sign-ups, the waiting list, offers, My Events) are added on Fri 23 Oct
    and logged in docs/decisions.md.

    Conventions match BloodLink: `x-safety` on every operation, `X-Request-Id` echoed on every
    response, and the shared `Error` shape on every failure.
servers:
  - url: http://localhost:4011
    description: Prism mock (npm run mock)
  - url: http://localhost:8080
    description: Local service
tags:
  - name: Sessions
    description: Sign-in with demonstration accounts.
  - name: Operations
    description: Health for the host and for waking the service.
security:
  - bearerAuth: []

paths:
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Sign in with a demonstration account and receive an access token
      x-safety: neither
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              email: organiser@fairseat.demo
              password: Demo-Password-1
      responses:
        '201':
          description: Signed in
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness and database reachability
      x-safety: safe
      security: []
      responses:
        '200':
          description: Service and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: Service is up but the database is not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    X-Request-Id:
      description: The request identifier sent by the interface, or one generated by the service.
      schema:
        type: string
        maxLength: 64
        example: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55

  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: One identifier per user action. Echoed back and logged.
      schema:
        type: string
        maxLength: 64

  responses:
    BadRequest:
      description: '`MALFORMED_REQUEST`: unreadable JSON or a wrong type.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: '`INVALID_CREDENTIALS`: email or password is wrong.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_CREDENTIALS
            message: Email or password is incorrect.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    ValidationFailed:
      description: '`VALIDATION_FAILED`: well-formed but breaks a rule; `details` names each field.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: '`INTERNAL_ERROR`: unexpected failure. Quote the requestId when reporting.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          description: Stable machine-readable code. The interface switches on this, never on `message`.
          enum:
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - INTERNAL_ERROR
        message:
          type: string
          maxLength: 300
        requestId:
          type: string
          maxLength: 64
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, issue]
            properties:
              field:
                type: string
              issue:
                type: string
      example:
        code: MALFORMED_REQUEST
        message: The body could not be read as JSON.
        requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
        details: []

    Role:
      type: string
      enum: [ATTENDEE, ORGANISER, ADMIN]

    SessionCreate:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    Session:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`.'
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.demo.signature
        tokenType: Bearer
        expiresAt: '2026-10-26T18:00:00Z'
        user:
          id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          displayName: Kemi Adebayo
          email: organiser@fairseat.demo
          role: ORGANISER

    User:
      type: object
      additionalProperties: false
      required: [id, displayName, email, role]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
