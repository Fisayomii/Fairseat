openapi: 3.1.0
info:
  title: FairSeat API
  version: 0.1.0
  summary: Fair seating and waiting lists for free meetups (TeSA Africa capstone, Team 4 side project).
  description: |
    Single source of truth for the FairSeat service. Every operation declares `x-safety`
    (safe, idempotent or neither). Every response carries the `X-Request-Id` header, echoed
    from the request or generated by the service.

    Seat rules the interface can rely on:
    - Confirmed seats (`GOING` plus live `OFFERED`) never exceed `seats`.
    - The waiting list is first come, first served.
    - An offer lasts 24 hours. A read never changes data, so an offer whose window has passed is
      reported as `OFFER_EXPIRED` on read even before the service has moved the seat on.
    - All data is fictional demonstration data.
  contact:
    name: Team 4 (FairSeat)
    url: https://github.com/Fisayomii
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local service
  - url: http://localhost:4011
    description: Prism mock (npm run mock)
tags:
  - name: Sessions
    description: Sign in and receive a bearer token.
  - name: Events
    description: Free meetups with a fixed number of seats.
  - name: Signups
    description: A person's place at an event, either a seat or a waiting-list position.
  - name: Me
    description: The signed-in person's own sign-ups and notices.
  - name: Health
    description: Liveness for the deploy pipeline.
security:
  - bearerAuth: []

paths:
  /actuator/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health
      description: Used by the deploy job to wait for the new release.
      x-safety: safe
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The service is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Sign in
      description: Exchanges an email and password for a bearer token valid for 8 hours. There is no refresh; sign in again when it expires.
      x-safety: neither
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '201':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Email or password is wrong. Code INVALID_CREDENTIALS. The message does not say which.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: Find events
      description: |
        Lists events ordered by start time. Filters combine with AND. By default only events that
        have not yet ended and are not cancelled are returned. Open to visitors; a token is optional.
      x-safety: safe
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          description: Keyword matched against title and description, case-insensitive.
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          description: Exact category.
          schema: { $ref: '#/components/schemas/Category' }
        - name: location
          in: query
          description: Text matched against location, case-insensitive (for example "Yaba").
          schema: { type: string, maxLength: 100 }
        - name: from
          in: query
          description: Only events starting on or after this date (Africa/Lagos calendar day).
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Only events starting on or before this date (Africa/Lagos calendar day).
          schema: { type: string, format: date }
        - name: organiserId
          in: query
          description: Only events run by this organiser. Organisers pass their own id to list their events.
          schema: { type: string, format: uuid }
        - name: includePast
          in: query
          description: Include events that have already ended.
          schema: { type: boolean, default: false }
        - name: includeCancelled
          in: query
          description: Include cancelled events.
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Number of events to skip.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of events.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createEvent
      tags: [Events]
      summary: Create an event
      description: Organisers and admins only. The caller becomes the organiser.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getEvent
      tags: [Events]
      summary: Event details
      description: Open to visitors. With a token, `mySignup` holds the caller's active sign-up if any.
      x-safety: safe
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The event.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateEvent
      tags: [Events]
      summary: Edit an event
      description: |
        The event's organiser or an admin only. Send only the fields that change. Raising `seats`
        offers the new seats to the waiting list at once. Lowering `seats` below the seats already
        taken is refused with SEATS_BELOW_TAKEN. Everyone signed up or waiting receives an
        EVENT_CHANGED notice.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /events/{eventId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: cancelEvent
      tags: [Events]
      summary: Cancel an event
      description: |
        The event's organiser or an admin only. Every active sign-up becomes CANCELLED and its
        holder receives an EVENT_CANCELLED notice. Cancelling an already cancelled event returns
        it unchanged.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The cancelled event.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}/signups:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: createSignup
      tags: [Signups]
      summary: Sign up for an event
      description: |
        Attendees only. Takes a seat if one is free (status GOING), otherwise joins the end of the
        waiting list (status WAITING). Safe to repeat: if the caller already has an active sign-up
        for this event, it is returned with 200 and nothing changes.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: New sign-up, GOING or WAITING.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signup'
        '200':
          description: The caller's existing active sign-up. Nothing changed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signup'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /signups/{signupId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/SignupId'
    post:
      operationId: cancelSignup
      tags: [Signups]
      summary: Give up a seat or waiting place
      description: |
        The sign-up's owner only. A freed seat is offered to the next person waiting in the same
        transaction. Cancelling an already cancelled or expired sign-up returns it unchanged.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The sign-up, now CANCELLED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signup'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /signups/{signupId}/acceptance:
    parameters:
      - $ref: '#/components/parameters/SignupId'
    post:
      operationId: acceptOffer
      tags: [Signups]
      summary: Accept an offered seat
      description: |
        The sign-up's owner only. Succeeds only while `offerExpiresAt` is in the future, judged by
        the database clock; at the exact expiry instant it is refused with OFFER_EXPIRED. Accepting
        a sign-up that is already GOING returns it unchanged. When refused as expired, the seat has
        already moved on to the next person waiting.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The sign-up, now GOING.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signup'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/signups:
    get:
      operationId: listMySignups
      tags: [Me]
      summary: My Events
      description: |
        The caller's latest sign-up for each event, with the status as of `asOf`. A cancel followed
        by a new sign-up shows once, as the new one. Upcoming is soonest first; past and all are
        most recent first.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: scope
          in: query
          description: upcoming = events not yet ended; past = ended; all = both.
          schema:
            type: string
            enum: [upcoming, past, all]
            default: upcoming
      responses:
        '200':
          description: The caller's sign-ups.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/notices:
    get:
      operationId: listMyNotices
      tags: [Me]
      summary: My notices
      description: In-platform notices for the caller, newest first, at most 50.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The caller's notices.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /sessions. Claims sub (user id), roles, name, exp.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlates one user action across both tiers. The service generates one when absent and returns it.
      schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
    EventId:
      name: eventId
      in: path
      required: true
      description: Event id.
      schema: { type: string, format: uuid }
    SignupId:
      name: signupId
      in: path
      required: true
      description: Sign-up id.
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: The request id used in the service logs for this call.
      schema: { type: string }

  responses:
    ValidationFailed:
      description: The request is malformed. Code VALIDATION_FAILED; `details` maps field names to messages.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: No valid token. Code UNAUTHENTICATED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Signed in but not allowed. Code FORBIDDEN_ROLE, NOT_EVENT_OWNER or NOT_SIGNUP_OWNER.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such event or sign-up. Code EVENT_NOT_FOUND or SIGNUP_NOT_FOUND.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The action does not fit the current state. Codes: EVENT_CANCELLED, EVENT_STARTED,
        SEATS_BELOW_TAKEN, OFFER_EXPIRED, NO_ACTIVE_OFFER. The interface should reload the
        resource and show its true state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: Every failure has this shape. Switch on `code`, never on `message`.
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Stable machine-readable reason.
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - FORBIDDEN_ROLE
            - NOT_EVENT_OWNER
            - NOT_SIGNUP_OWNER
            - EVENT_NOT_FOUND
            - SIGNUP_NOT_FOUND
            - NOT_FOUND
            - EVENT_CANCELLED
            - EVENT_STARTED
            - SEATS_BELOW_TAKEN
            - OFFER_EXPIRED
            - NO_ACTIVE_OFFER
            - INTERNAL_ERROR
          example: OFFER_EXPIRED
        message:
          type: string
          description: Human-readable explanation, safe to show.
          example: This seat offer expired at 18:00. The seat has gone to the next person waiting.
        requestId:
          type: string
          description: Same value as the X-Request-Id header.
          example: 7f3c2a9e-req
        details:
          type: object
          description: Extra data, for example field errors for VALIDATION_FAILED.
          additionalProperties: true

    Health:
      type: object
      description: Actuator health.
      required: [status]
      properties:
        status:
          type: string
          description: UP when healthy.
          example: UP

    Role:
      type: string
      description: Role carried in the token.
      enum: [ATTENDEE, ORGANISER, ADMIN]

    User:
      type: object
      description: A person using FairSeat. Fictional demo data.
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid, example: 6d1f9a10-0000-4000-8000-000000000101 }
        email: { type: string, format: email, example: amaka.attendee@fairseat.demo }
        displayName: { type: string, example: Amaka Obi }
        role: { $ref: '#/components/schemas/Role' }

    SessionRequest:
      type: object
      description: Sign-in credentials.
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, example: tolu.organiser@fairseat.demo }
        password: { type: string, minLength: 1, maxLength: 128, example: FairSeat-demo-2026 }

    Session:
      type: object
      description: A signed-in session.
      required: [token, expiresAt, user]
      properties:
        token: { type: string, description: Bearer token for the Authorization header. }
        expiresAt: { type: string, format: date-time, example: '2026-10-26T17:00:00Z' }
        user: { $ref: '#/components/schemas/User' }

    Category:
      type: string
      description: Kind of meetup.
      enum: [TECH, DESIGN, PRODUCT, CAREER, BUSINESS, COMMUNITY]
      example: TECH

    EventStatus:
      type: string
      description: SCHEDULED or CANCELLED. Whether it has started or ended follows from the times.
      enum: [SCHEDULED, CANCELLED]

    OrganiserRef:
      type: object
      description: Who runs the event.
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, example: Tolu Adebayo }

    EventCreate:
      type: object
      description: A new event. `endsAt` must be after `startsAt`, and `startsAt` in the future.
      required: [title, category, location, startsAt, endsAt, seats]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Lagos React Meetup }
        description: { type: string, maxLength: 4000, default: '', example: Talks on React Server Components and testing. }
        category: { $ref: '#/components/schemas/Category' }
        location: { type: string, minLength: 1, maxLength: 200, example: 'Yaba, Lagos' }
        startsAt: { type: string, format: date-time, example: '2026-11-07T15:00:00Z' }
        endsAt: { type: string, format: date-time, example: '2026-11-07T18:00:00Z' }
        seats: { type: integer, minimum: 1, maximum: 1000, example: 40 }

    EventUpdate:
      type: object
      description: Fields to change. Omitted fields keep their value. At least one field is required.
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        category: { $ref: '#/components/schemas/Category' }
        location: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        seats: { type: integer, minimum: 1, maximum: 1000 }

    Event:
      type: object
      description: |
        An event with its seat counts as of `asOf`. `seatsTaken` counts GOING plus live offers.
        `seatsAvailable` can be above zero for up to a minute after an offer lapses while the
        seat is being passed on.
      required: [id, title, description, category, location, startsAt, endsAt, seats, seatsTaken, seatsAvailable, goingCount, offeredCount, waitingCount, status, organiser, asOf]
      properties:
        id: { type: string, format: uuid, example: 9b2e0c44-0000-4000-8000-000000000201 }
        title: { type: string, example: Lagos React Meetup }
        description: { type: string, example: Talks on React Server Components and testing. }
        category: { $ref: '#/components/schemas/Category' }
        location: { type: string, example: 'Yaba, Lagos' }
        startsAt: { type: string, format: date-time, example: '2026-11-07T15:00:00Z' }
        endsAt: { type: string, format: date-time, example: '2026-11-07T18:00:00Z' }
        seats: { type: integer, example: 40 }
        seatsTaken: { type: integer, example: 38 }
        seatsAvailable: { type: integer, example: 2 }
        goingCount: { type: integer, example: 37 }
        offeredCount: { type: integer, example: 1 }
        waitingCount: { type: integer, example: 0 }
        status: { $ref: '#/components/schemas/EventStatus' }
        organiser: { $ref: '#/components/schemas/OrganiserRef' }
        mySignup:
          description: The caller's active sign-up for this event, or null. Only set when a token is sent.
          oneOf:
            - $ref: '#/components/schemas/Signup'
            - type: 'null'
        asOf: { type: string, format: date-time, description: When the counts were computed. }

    EventPage:
      type: object
      description: A page of events.
      required: [items, total, limit, offset, asOf]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        total: { type: integer, description: Matching events across all pages., example: 22 }
        limit: { type: integer, example: 20 }
        offset: { type: integer, example: 0 }
        asOf: { type: string, format: date-time }

    SignupStatus:
      type: string
      description: |
        GOING = has a seat. WAITING = in the queue. OFFERED = a seat is held until offerExpiresAt.
        OFFER_EXPIRED = the offer lapsed and the seat moved on. CANCELLED = given up, or the event was cancelled.
      enum: [GOING, WAITING, OFFERED, OFFER_EXPIRED, CANCELLED]

    EventSummary:
      type: object
      description: The event a sign-up belongs to.
      required: [id, title, location, startsAt, endsAt, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: Lagos React Meetup }
        location: { type: string, example: 'Yaba, Lagos' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EventStatus' }

    Signup:
      type: object
      description: One person's place at one event, as of `asOf`.
      required: [id, event, status, waitingPosition, offerExpiresAt, createdAt, updatedAt, asOf]
      properties:
        id: { type: string, format: uuid, example: 3a7d5e10-0000-4000-8000-000000000301 }
        event: { $ref: '#/components/schemas/EventSummary' }
        status: { $ref: '#/components/schemas/SignupStatus' }
        waitingPosition:
          type: [integer, 'null']
          description: 1 = next in line. Set only when WAITING. A position, not a time estimate.
          example: 2
        offerExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Set when OFFERED or OFFER_EXPIRED.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        asOf: { type: string, format: date-time, description: When the status was computed. }

    SignupList:
      type: object
      description: The caller's sign-ups.
      required: [items, asOf]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Signup' }
        asOf: { type: string, format: date-time }

    NoticeKind:
      type: string
      description: Why the notice was sent.
      enum: [SEAT_OFFERED, OFFER_EXPIRED, EVENT_CHANGED, EVENT_CANCELLED]

    Notice:
      type: object
      description: An in-platform notice.
      required: [id, kind, eventId, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NoticeKind' }
        eventId: { type: string, format: uuid }
        message: { type: string, example: A seat opened at Lagos React Meetup. Accept it before 26 Oct 18:00. }
        createdAt: { type: string, format: date-time }

    NoticeList:
      type: object
      description: The caller's notices.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notice' }
