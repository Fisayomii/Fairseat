spring:
  application:
    name: fairseat-api
  threads:
    virtual:
      enabled: true
  datasource:
    # JDBC form, e.g. jdbc:postgresql://host:5432/db?sslmode=require (not postgres://...).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fairseat}
    username: ${DATABASE_USERNAME:fairseat}
    password: ${DATABASE_PASSWORD:fairseat}
    hikari:
      # Free Postgres tiers allow few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # On for v0 so a fresh deploy migrates itself. From Fri the pipeline runs migrations before the deploy
    # and the host sets LIQUIBASE_ENABLED=false.
    enabled: ${LIQUIBASE_ENABLED:true}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

app:
  cors:
    # Comma-separated. On the host: ALLOWED_ORIGINS=https://<your-site>.netlify.app
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
fairseat:
  jwt:
    # Set JWT_SECRET (at least 32 characters) on the deployed service. The default is for local runs only.
    secret: ${JWT_SECRET:local-dev-only-secret-set-JWT_SECRET-in-prod-0123456789}
  offers:
    window-hours: 24
    sweep-enabled: true
    sweep-interval: PT1M

logging:
  structured:
    format:
      console: logstash
